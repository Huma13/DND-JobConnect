# Issue #7: SonarQube / SonarCloud analysis settings.
# The scan runs from the backend/ folder (see projectBaseDir in .github/workflows/ci.yml).

# --- CHANGE THESE TWO to the values from your SonarCloud project ---
sonar.organization=YOUR_SONAR_ORGANIZATION_KEY
sonar.projectKey=YOUR_SONAR_PROJECT_KEY
# (Self-hosted SonarQube has no organization: delete the line above and set the
#  SONAR_HOST_URL repository variable instead.)

sonar.projectName=DND-JobConnect
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Everything under backend/ is analysed. Test files are kept out of the
# production-code rules and are declared with sonar.tests.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/test_*.py,**/*_test.py,**/conftest.py
sonar.exclusions=**/migrations/**,loadtest/**,**/.venv/**,**/__pycache__/**,**/tests/**,**/test_*.py,**/*_test.py,**/conftest.py
sonar.coverage.exclusions=**/tests/**,**/test_*.py,**/conftest.py,**/migrations/**,loadtest/**,manage.py,config/asgi.py,config/wsgi.py

# Written by the "Tests with coverage" step in CI.
sonar.python.coverage.reportPaths=coverage.xml
