# Issue #6: every PR is built and tested; merging to main deploys.
# Issue #7: SonarQube analyses every build and fails it on a bad quality gate.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: jobconnect
          POSTGRES_USER: jobconnect
          POSTGRES_PASSWORD: jobconnect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobconnect" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      POSTGRES_HOST: localhost
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarQube needs the full history to tell which code is new.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests with coverage
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing:skip-covered --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml
      - name: SonarQube scan (fails the build if the quality gate fails)
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Leave the SONAR_HOST_URL variable unset to use SonarCloud.
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          projectBaseDir: backend
          args: -Dsonar.qualitygate.wait=true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t jobconnect-backend:${{ github.sha }} backend
      - name: Compose file is valid
        run: cp backend/.env.example backend/.env && docker compose config -q

  deploy:
    # Runs only after a PR is merged into main and tests + image build pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, frontend, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push to GitHub Container Registry
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/backend
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest backend
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
