# One command starts everything (issue #8, SRS 2.4):  docker compose up --build
x-backend: &backend
  build: ./backend
  env_file: ./backend/.env
  environment:
    # seed_demo points the demo mailbox at the Mailpit container below.
    DEMO_SMTP_HOST: mailpit
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobconnect}
      POSTGRES_USER: ${POSTGRES_USER:-jobconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobconnect}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  web:
    <<: *backend
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=4"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  # Web app on http://localhost:5173; /api is forwarded to the web service.
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_PROXY_TARGET: http://web:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: ["5173:5173"]
    depends_on: [web]

  # Catches email applications sent in the demo; read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025"]
    restart: unless-stopped

volumes:
  frontend_node_modules:
  pgdata:
  redisdata:
